# Conferência automática a cada mudança: roda os testes da API e confere o site (tipos + build de produção).
# Se algo quebrar, o GitHub avisa antes de a mudança ir para a main. Custo: zero (repositório público = minutos grátis).
name: Verificar (testes e build)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Testes da API
        run: dotnet test tests/NexoGestao.Tests --nologo

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/nexogestao-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/nexogestao-web/package-lock.json
      - run: npm ci
      - name: Conferir tipos
        run: npx tsc --noEmit
      - name: Build de produção
        run: npm run build
