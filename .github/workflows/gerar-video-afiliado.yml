name: Gerar vídeo de afiliado (prova de conceito)

# Só acionado manualmente por enquanto (workflow_dispatch) — fase de prova de
# funcionamento. Roda isolado do backend/API que a Débora usa no dia a dia:
# nada aqui compartilha processo, memória ou fila com o Render. Quando
# validado, o backend passa a disparar isso via repository_dispatch.
#
# Narração: edge-tts (biblioteca gratuita, sem conta/chave, usa as mesmas
# vozes neurais do "Ler em voz alta" do navegador Edge). Vídeo: FFmpeg, com
# zoom lento sobre a foto pública do próprio anúncio + legendas queimadas
# sincronizadas com a narração. Sem apresentadora virtual — ver relatório.
on:
  workflow_dispatch:
    inputs:
      imagem_url:
        description: "URL pública da foto do produto"
        required: true
      texto_narracao:
        description: "Texto a ser narrado (só fatos do próprio anúncio, sem invenção)"
        required: true
      texto_cta:
        description: "Texto de fechamento (aparece como legenda final)"
        required: true

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar FFmpeg, fonte e edge-tts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pip
          pip install --quiet edge-tts

      - name: Baixar imagem do produto
        # Só a imagem pública do próprio anúncio — nunca material de terceiros sem permissão.
        run: curl -sL -A "Mozilla/5.0" "${{ inputs.imagem_url }}" -o produto.jpg

      - name: Gerar narração em português (voz neural gratuita)
        env:
          NARRACAO: ${{ inputs.texto_narracao }}
        run: python3 -m edge_tts --voice pt-BR-FranciscaNeural --text "$NARRACAO" --write-media narracao.mp3

      - name: Medir duração da narração
        id: duracao
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 narracao.mp3)
          # Vídeo = duração da narração + 1.5s de respiro no fechamento.
          TOTAL=$(python3 -c "print(round(float('$DUR') + 1.5, 2))")
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Duração da narração: ${DUR}s — vídeo total: ${TOTAL}s"

      - name: Preparar arquivos de legenda (texto quebrado em linhas curtas)
        env:
          NARRACAO: ${{ inputs.texto_narracao }}
          CTA: ${{ inputs.texto_cta }}
        run: |
          python3 - <<'PYEOF'
          import os, textwrap
          narracao = os.environ["NARRACAO"]
          cta = os.environ["CTA"]
          with open("legenda1.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(textwrap.wrap(narracao, width=26)))
          with open("legenda2.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(textwrap.wrap(cta, width=26)))
          PYEOF
          echo "--- legenda1.txt ---"; cat legenda1.txt
          echo "--- legenda2.txt ---"; cat legenda2.txt

      - name: Montar vídeo vertical (zoom + legendas) e juntar com a narração
        env:
          TOTAL: ${{ steps.duracao.outputs.total }}
        run: |
          FONTE=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          CORTE=$(python3 -c "print(round(float('$TOTAL') - 2, 2))")
          ffmpeg -y -loop 1 -i produto.jpg -i narracao.mp3 -t "$TOTAL" -vf "
            scale=1080:1920:force_original_aspect_ratio=increase,
            crop=1080:1920,
            zoompan=z='min(zoom+0.0005,1.1)':d=1:s=1080x1920:fps=25,
            drawtext=fontfile=${FONTE}:textfile=legenda1.txt:fontcolor=white:fontsize=46:line_spacing=10:borderw=4:bordercolor=black:x=(w-text_w)/2:y=h-520:enable='between(t,0,${CORTE})':box=1:boxcolor=black@0.4:boxborderw=20,
            drawtext=fontfile=${FONTE}:textfile=legenda2.txt:fontcolor=white:fontsize=52:line_spacing=10:borderw=4:bordercolor=black:x=(w-text_w)/2:y=h-320:enable='gte(t,${CORTE})':box=1:boxcolor=black@0.4:boxborderw=20
          " -map 0:v -map 1:a -c:v libx264 -pix_fmt yuv420p -r 25 -c:a aac -shortest video-final.mp4
          ls -la video-final.mp4
          ffprobe -v error -show_entries format=duration,format=size -of default=noprint_wrappers=1 video-final.mp4

      - name: Enviar vídeo como artefato (expira em 7 dias)
        uses: actions/upload-artifact@v4
        with:
          name: video-afiliado
          path: video-final.mp4
          retention-days: 7
