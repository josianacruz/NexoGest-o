# Backup diário do banco de produção (Neon), CRIPTOGRAFADO, guardado como artefato do GitHub por 7 dias.
#
# ATENÇÃO — preparado, NÃO ligado:
#  - O repositório é PÚBLICO: qualquer pessoa com conta no GitHub consegue baixar artefatos. Por isso o arquivo só
#    é publicado depois de criptografado (AES-256) com uma senha que fica em segredo. Sem a senha ele não abre.
#    Use uma senha longa e aleatória (24+ caracteres) e guarde-a em lugar seguro: sem ela, o backup não restaura.
#  - Só roda se a variável do repositório BACKUP_ATIVO for "true" (Settings > Secrets and variables > Actions > Variables).
#  - Precisa de dois segredos do repositório: NEXO_PROD_CONNECTION (connection string URL do Neon, produção) e
#    BACKUP_SENHA (a senha de criptografia). Nada disso fica neste arquivo.
#  - Para restaurar: baixe o artefato, rode `gpg --decrypt backup.dump.gpg > backup.dump` e depois `pg_restore`.
#  - 03:00 em Brasília = 06:00 UTC. O GitHub pode atrasar execuções agendadas por alguns minutos.
name: Backup diário do banco (criptografado)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    if: ${{ vars.BACKUP_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar o cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar, conferir e criptografar o backup
        env:
          NEXO_PROD_CONNECTION: ${{ secrets.NEXO_PROD_CONNECTION }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          set -euo pipefail
          if [ -z "${NEXO_PROD_CONNECTION}" ] || [ -z "${BACKUP_SENHA}" ]; then echo "Faltam os segredos NEXO_PROD_CONNECTION e BACKUP_SENHA."; exit 1; fi
          if [ "${#BACKUP_SENHA}" -lt 20 ]; then echo "BACKUP_SENHA precisa ter pelo menos 20 caracteres."; exit 1; fi
          pg_dump "${NEXO_PROD_CONNECTION}" --no-owner --no-privileges -Fc -f backup.dump
          itens=$(pg_restore --list backup.dump | wc -l)
          echo "Itens no backup: ${itens}"
          if [ "${itens}" -lt 20 ]; then echo "Backup parece vazio."; exit 1; fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "${BACKUP_SENHA}" --symmetric --cipher-algo AES256 -o backup.dump.gpg backup.dump
          rm -f backup.dump

      - name: Guardar por 7 dias
        uses: actions/upload-artifact@v4
        with:
          name: backup-nexo-${{ github.run_id }}
          path: backup.dump.gpg
          retention-days: 7
          if-no-files-found: error
